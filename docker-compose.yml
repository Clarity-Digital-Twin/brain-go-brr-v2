# docker-compose.yml for Brain-Go-Brr v4.0.0
# GPU-accelerated EEG seizure detection training
version: '3.8'

services:
  train-base:
    build:
      context: .
      dockerfile: Dockerfile
    image: brain-go-brr:v4.0.0

    # GPU access (requires nvidia-container-toolkit)
    runtime: nvidia

    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - BGB_NAN_DEBUG=1
      - WANDB_API_KEY=${WANDB_API_KEY:-}

    volumes:
      # CRITICAL: Mount BOTH data sources (matches local training exactly)

      # Original EDFs (read-only) - 109GB
      # Required for: smoke tests with EEGWindowDataset (use_balanced_sampling: false)
      - ./data_ext4:/app/data_ext4:ro

      # Memory-mapped cache (read-only) - 518GB
      # Required for: ALL training (BalancedSeizureDataset + ValidationDataset)
      - ./cache/tusz_mmap:/app/cache/tusz_mmap:ro

      # Results (read-write)
      # Required for: checkpoints, logs, outputs
      - ./results:/app/results:rw

      # Configs (read-only)
      - ./configs:/app/configs:ro

    shm_size: 8gb

  smoke-test:
    extends: train-base
    container_name: bgb-smoke

    environment:
      - BGB_SMOKE_TEST=1
      # No BGB_LIMIT_FILES - defaults to 3 files for fast validation (~5 min)

    command: python3.11 -m src train /app/configs/local/smoke_bimamba.yaml

  integration-test:
    extends: train-base
    container_name: bgb-integration

    environment:
      - BGB_SMOKE_TEST=1
      - BGB_LIMIT_FILES=50
      # Deeper validation with 50 files (~60 min)

    command: python3.11 -m src train /app/configs/local/smoke_bimamba.yaml

  train:
    extends: train-base
    container_name: bgb-train

    command: python3.11 -m src train /app/configs/local/train_bimamba.yaml

    restart: unless-stopped

  dev:
    extends: train-base
    container_name: bgb-dev

    volumes:
      # Override: editable source code
      - ./src:/app/src:rw
      # CRITICAL: Must match train-base paths (matches local training exactly)
      - ./data_ext4:/app/data_ext4:ro
      - ./cache/tusz_mmap:/app/cache/tusz_mmap:ro
      - ./results:/app/results:rw
      - ./configs:/app/configs:ro

    command: bash
    stdin_open: true
    tty: true
