# Modal A100 Full Training: TCN + FLA (Gated DeltaNet) + GNN Stack (V3)
# Optimized for A100-80GB on Modal cloud with proper resource allocation
# Usage: modal run --detach deploy/modal/app.py --action train --config configs/modal/train_fla.yaml
#
# ========================================================================
# 🚨 NaN Protection (Automatically Enabled on Modal)
# ========================================================================
# Modal automatically sets debugging via deploy/modal/app.py:
#   BGB_NAN_DEBUG=1       # ✅ Shows NaN warnings
#
# Gradient clipping (0.5) is always applied from config (primary protection).
# No manual environment setup needed for Modal!
# See: docs/08-operations/gradient-protection-guide.md for details
# ========================================================================

data:
  dataset: tuh_eeg
  data_dir: /data/edf                    # Parent dir containing train/dev/eval
  cache_dir: /results/cache/tusz_mmap  # Memory-mapped `_data.npy`/`_labels.npy` pairs on Modal SSD (read-only)
  sampling_rate: 256
  n_channels: 19
  window_size: 60
  stride: 10
  num_workers: 4                        # SAFE: Prevents spawn delays (8 caused overhead)
  pin_memory: true                      # Fast GPU transfer
  persistent_workers: true              # Keeps mmap pages hot across epochs (fast start-up)
  prefetch_factor: 2                    # SAFE: Prevents memory pressure (4/8 caused OOM)
  # ⚠️ CRITICAL: Without balanced sampling, batches may have ZERO seizures! ⚠️
  use_balanced_sampling: true          # CRITICAL: Use positive-aware sampling

preprocessing:
  montage: "10-20"
  bandpass: [0.5, 120]
  notch_freq: 60
  normalize: true

model:
  # Architecture: "v3" (dual-stream with edge Mamba)
  architecture: v3  # V3 dual-stream with learned adjacency

  # PR-1: Boundary Normalization (ENABLED)
  # Prevents unbounded information flows between components
  norms:
    boundary_norm: layernorm     # LayerNorm at component boundaries
    boundary_eps: 1.0e-5          # Epsilon for numerical stability
    layerscale_alpha: 0.1         # Initial LayerScale value
    after_tcn_proj: true          # Normalize after TCN projection
    after_node_mamba: true        # Normalize after node Mamba
    after_edge_mamba: true        # Normalize after edge Mamba
    after_gnn: true               # Normalize after GNN
    before_decoder: true          # Normalize before decoder

  tcn:
    num_layers: 8
    kernel_size: 7
    dropout: 0.15
    causal: false
    stride_down: 16
    use_cuda_optimizations: true

  mamba:
    n_layers: 6
    d_model: 512
    d_state: 16
    conv_kernel: 4  # CUDA constraint: must be 2-4
    dropout: 0.1

    # FLA (Gated DeltaNet) architecture configuration
    temporal_type: gated_deltanet   # Use GatedDeltaNet instead of BiMamba2
    gdn_fusion_mode: sum            # Bidirectional fusion (simpler than concat)
    gdn_allow_neg_eigval: false     # Conservative eigenvalue handling

    # Edge GDN head config (required for edge_mamba_d_model=32)
    # Constraint: num_heads × headdim = 0.75 × d_model
    # 3 × 8 = 24 = 0.75 × 32 ✅
    gdn_edge_num_heads: 3
    gdn_edge_headdim: 8

  # Graph configuration (V3)
  graph:
    enabled: true              # Required for V3

    # PR-2: Bounded Edge Stream (ENABLED)
    edge_lift_activation: tanh       # Bound edge features to [-1, 1]
    edge_lift_norm: layernorm        # Normalize after edge lift
    edge_lift_init_gain: 0.1         # Conservative initialization

    # V3: Edge stream config
    edge_features: cosine      # Edge feature metric for v3
    edge_top_k: 3              # Top-k edges per node for v3
    edge_threshold: 1.0e-4     # Edge weight cutoff for v3
    edge_mamba_layers: 2       # Edge Mamba layers for v3
    edge_mamba_d_state: 8      # Edge Mamba state dim for v3
    edge_mamba_d_model: 32     # FLA requirement: causal_conv1d needs d_model=32
    edge_similarity_margin: 0.01  # PR-5: Safety margin from ±1 boundaries

    # PR-3: Adjacency Conditioning (ENABLED)
    adj_row_softmax: true            # Row-wise softmax normalization
    adj_softmax_tau: 1.0             # Temperature for softmax
    adj_ema_beta: 0.95               # EMA smoothing for temporal stability
    adj_force_symmetric: true        # Force symmetric Laplacian
    laplacian_eps: 1.0e-3            # Regularization for stable eigendecomp
    laplacian_normalize: true        # Use normalized Laplacian

    # V2 heuristic removed

    # GNN architecture
    n_layers: 2                # 2-layer GNN
    dropout: 0.1
    use_residual: true         # Skip connections
    alpha: 0.05                # SSGConv mixing
    k_eigenvectors: 16         # Laplacian PE dimension

    # Dynamic PE config (v3) - ALWAYS ENABLED
    use_dynamic_pe: true       # ALWAYS use dynamic PE (EvoBrain approach)
    semi_dynamic_interval: 5   # OPTIMAL: 192 eigendecomps, 19.5ms updates (CLAUDE.md:97)
    pe_sign_consistency: true  # Fix eigenvector signs for stability

postprocessing:
  hysteresis:
    tau_on: 0.86    # Matches constants.HYSTERESIS_TAU_ON
    tau_off: 0.78   # Matches constants.HYSTERESIS_TAU_OFF
  morphology:
    opening_kernel: 11
    closing_kernel: 31
  duration:
    min_duration_s: 3.0
    max_duration_s: 600.0
  events:
    tau_merge: 2.0
    confidence_method: mean

training:
  epochs: 100                          # full training - will early stop if converged
  batch_size: 48                       # EXPERIMENT: ~58GB peak (testing if faster than 32×2)
  # ⚠️ CRITICAL: MUST use focal loss for 12:1 class imbalance! ⚠️
  # Without this, model WILL collapse to AUROC=0.5 (useless)
  loss: focal                          # USE FOCAL LOSS FOR EXTREME IMBALANCE!
  focal_alpha: 0.5                     # MUST BE 0.5! (neutral - let pos_weight handle imbalance)
  focal_gamma: 2.0                     # Focusing parameter (higher = more focus on hard examples)
  learning_rate: 8.0e-5                # v3.4.0: Increased from 3e-5 (batch-size scaled)
  weight_decay: 0.05
  optimizer: adamw
  scheduler:
    type: cosine
    warmup_ratio: 0.03

  # 🔥 NEW (v3.4.1): Warmup Schedules for Gradient Stabilization
  # ENABLED for gradient stabilization testing
  warmup_schedule:
    enabled: true
    warmup_steps: 1000
    adj_temperature_enabled: true
    adj_temperature_start: 2.0
    adj_temperature_end: 1.0
    focal_gamma_enabled: true
    focal_gamma_start: 1.0
    focal_gamma_end: 2.0

  gradient_clip: 0.5                   # Stronger clipping for NaN protection
  mixed_precision: true                # A100 is 3.8x faster at FP16! Critical for performance
  gradient_accumulation_steps: 1       # EXPERIMENT: No accumulation with batch_size=48
  early_stopping:
    patience: 5
    metric: sensitivity_at_10fa
  checkpoint_interval: 1               # Save every epoch for full training
  mid_checkpoint_interval_s: 1800      # Save every 30 minutes (critical for 6-7h epochs)
  mid_epoch_keep: 3                    # Keep last 3 mid-epoch snapshots

evaluation:
  fa_rates: [10, 5, 2.5, 1]
  save_predictions: true               # Cloud has space
  save_plots: true                     # Generate all visualizations

experiment:
  name: v3_full_training_fla
  description: "V3 dual-stream full training - FLA(GatedDeltaNet) on Modal A100"
  seed: 42
  device: cuda                         # Explicit GPU for consistency
  output_dir: /results/v3_fla_training        # Modal volume mount (separate from BiMamba2)
  cache_dir: /results/cache/tusz_mmap     # Must match data.cache_dir (mmap NPY format)
  log_level: INFO
  save_model: true
  save_best_only: true
  wandb:
    enabled: true                      # W&B secret configured!
    project: seizure-detection-a100
    entity: jj-vcmcswaggins-novamindnyc  # Your W&B TEAM (matches API key)
    tags: ["v3", "a100", "dual-stream", "production"]

logging:
  log_every_n_steps: 25                # More frequent on fast GPU
  log_gradients: false
  log_weights: false
