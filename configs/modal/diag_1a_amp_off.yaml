# DIAGNOSTIC 1A: Disable AMP (Test if AMP is the root cause)
# Expected: If this passes, confirms Mamba-SSM kernel bug with AMP on A100

data:
  dataset: tuh_eeg
  data_dir: /data/edf
  cache_dir: /results/cache/tusz
  split_policy: official_tusz
  sampling_rate: 256
  n_channels: 19
  window_size: 60
  stride: 10
  num_workers: 8
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 4
  use_balanced_sampling: true

preprocessing:
  montage: "10-20"
  bandpass: [0.5, 120]
  notch_freq: 60
  normalize: true
  use_mne: true

model:
  architecture: v3

  tcn:
    num_layers: 8
    kernel_size: 7
    dropout: 0.15
    causal: false
    stride_down: 16
    use_cuda_optimizations: true

  mamba:
    n_layers: 6
    d_model: 512
    d_state: 16
    conv_kernel: 4
    dropout: 0.1

  graph:
    enabled: true
    edge_features: cosine
    edge_top_k: 3
    edge_threshold: 1.0e-4
    edge_mamba_layers: 2
    edge_mamba_d_state: 8
    edge_mamba_d_model: 16
    edge_similarity_margin: 0.01
    n_layers: 2
    dropout: 0.1
    use_residual: true
    alpha: 0.05
    k_eigenvectors: 16
    use_dynamic_pe: true
    semi_dynamic_interval: 1
    pe_sign_consistency: true

postprocessing:
  hysteresis:
    tau_on: 0.86
    tau_off: 0.78
  morphology:
    opening_kernel: 11
    closing_kernel: 31
  duration:
    min_duration_s: 3.0
    max_duration_s: 600.0
  events:
    tau_merge: 2.0
    confidence_method: mean

training:
  epochs: 1  # Just need preflight to pass
  batch_size: 64
  loss: focal
  focal_alpha: 0.5
  focal_gamma: 2.0
  learning_rate: 3e-5
  weight_decay: 0.05
  optimizer: adamw
  scheduler:
    type: cosine
    warmup_ratio: 0.03
  gradient_clip: 0.5
  mixed_precision: false  # 🔍 DIAGNOSTIC: AMP DISABLED
  gradient_accumulation_steps: 1
  early_stopping:
    patience: 5
    metric: sensitivity_at_10fa
  checkpoint_interval: 1

evaluation:
  metrics: [taes, sensitivity, specificity, auroc]
  fa_rates: [10, 5, 2.5, 1]
  save_predictions: true
  save_plots: true

experiment:
  name: diag_1a_amp_off
  description: "DIAGNOSTIC 1A: Test if disabling AMP resolves XID 31 crash"
  seed: 42
  device: cuda
  output_dir: /results/diag_1a_amp_off
  cache_dir: /results/cache/tusz
  log_level: INFO
  save_model: false
  save_best_only: false
  wandb:
    enabled: false  # No W&B for diagnostics

logging:
  log_every_n_steps: 25
  log_gradients: false
  log_weights: false