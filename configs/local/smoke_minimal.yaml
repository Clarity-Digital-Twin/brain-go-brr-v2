# Minimal smoke test - NO PRs enabled
experiment:
  name: smoke_minimal
  description: "Minimal smoke test"
  seed: 42
  output_dir: results/smoke_minimal
  device: cuda

model:
  architecture: v3

  tcn:
    num_layers: 8
    kernel_size: 7
    dropout: 0.15
    causal: false
    stride_down: 16
    use_cuda_optimizations: true

  mamba:
    n_layers: 6
    d_model: 512
    d_state: 16
    conv_kernel: 4
    dropout: 0.1

  graph:
    enabled: false  # DISABLED for minimal test

data:
  dataset: tuh_eeg
  data_dir: data_ext4/tusz/edf
  cache_dir: cache/tusz
  split_policy: official_tusz
  sampling_rate: 256
  n_channels: 19
  window_size: 60
  stride: 10
  use_balanced_sampling: false
  num_workers: 0
  pin_memory: false
  persistent_workers: false
  prefetch_factor: 2
  validation_split: 0.2

preprocessing:
  montage: "10-20"
  bandpass: [0.5, 120.0]
  notch_freq: 60
  normalize: true
  use_mne: true

training:
  epochs: 1
  batch_size: 4  # Smaller batch for safety
  learning_rate: 5.0e-5
  weight_decay: 0.05
  optimizer: adamw
  gradient_clip: 0.5
  mixed_precision: false

  loss: focal
  focal_alpha: 0.5
  focal_gamma: 2.0

  scheduler:
    type: cosine
    warmup_ratio: 0.1

postprocessing:
  hysteresis:
    tau_on: 0.86
    tau_off: 0.78

evaluation:
  metrics: [taes, sensitivity, specificity, auroc]
  fa_rates: [10, 5, 2.5, 1]
  save_predictions: false
  save_plots: false

logging:
  log_every_n_steps: 10
  log_gradients: false
  log_weights: false