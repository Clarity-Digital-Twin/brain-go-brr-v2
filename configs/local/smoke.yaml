# Smoke Test: TCN + Bi-Mamba + GNN Stack (V3)
# Quick validation (1 epoch) for pipeline testing on RTX 4090
#
# ========================================================================
# NaN Protection (gradient clipping is always applied from config)
# ========================================================================
# Optional environment variables:
#
#   export BGB_NAN_DEBUG=1       # Enable NaN warnings
#   # export BGB_SANITIZE_GRADS=1  # Debug: log gradient NaNs (not required)
#   export BGB_SMOKE_TEST=1      # Enables smoke test mode (3 files)
#
# Usage:
#   export BGB_NAN_DEBUG=1 BGB_SMOKE_TEST=1
#   python -m src train configs/local/smoke.yaml
#
# Or use Makefile:
#   make s  # Automatically sets flags
#
# See: docs/08-operations/gradient-protection-guide.md for details
# ========================================================================
#

experiment:
  name: smoke_test
  description: "Stack smoke test - TCN+BiMamba+GNN"
  seed: 42
  output_dir: results/smoke
  device: cuda

model:
  architecture: v3  # V3 dual-stream with learned adjacency

  # PR-1: Boundary Normalization (ENABLED - was missing in smoke tests!)
  # Prevents unbounded information flows between components
  norms:
    boundary_norm: layernorm     # LayerNorm at component boundaries
    boundary_eps: 1.0e-5          # Epsilon for numerical stability
    layerscale_alpha: 0.1         # Initial LayerScale value
    after_tcn_proj: true          # Normalize after TCN projection
    after_node_mamba: true        # Normalize after node Mamba
    after_edge_mamba: true        # Normalize after edge Mamba
    after_gnn: true               # Normalize after GNN
    before_decoder: true          # Normalize before decoder

  tcn:
    num_layers: 8
    kernel_size: 7
    dropout: 0.15
    causal: false
    stride_down: 16
    use_cuda_optimizations: true

  mamba:
    n_layers: 6
    d_model: 512
    d_state: 16
    conv_kernel: 4  # CUDA constraint: must be 2-4
    dropout: 0.1

  graph:
    enabled: true

    # PR-2: Bounded Edge Stream (ENABLED - was missing in smoke tests!)
    edge_lift_activation: tanh       # Bound edge features to [-1, 1]
    edge_lift_norm: layernorm        # Normalize after edge lift
    edge_lift_init_gain: 0.1         # Conservative initialization

    # V3: Edge stream config
    edge_features: cosine
    edge_top_k: 3
    edge_threshold: 1.0e-4
    edge_mamba_layers: 2
    edge_mamba_d_state: 8
    edge_mamba_d_model: 16
    edge_similarity_margin: 0.01  # PR-5: Safety margin from ±1 boundaries

    # PR-3: Adjacency Conditioning (ENABLED - was missing in smoke tests!)
    adj_row_softmax: true            # Row-wise softmax normalization
    adj_softmax_tau: 1.0             # Temperature for softmax
    adj_ema_beta: 0.95               # EMA smoothing for temporal stability
    adj_force_symmetric: true        # Force symmetric Laplacian
    laplacian_eps: 1.0e-3            # Regularization for stable eigendecomp
    laplacian_normalize: true        # Use normalized Laplacian

    # GNN architecture
    n_layers: 2
    dropout: 0.1
    use_residual: true
    alpha: 0.05
    k_eigenvectors: 16
    use_dynamic_pe: true
    semi_dynamic_interval: 5  # FIXED: was 10, now 5 (optimal per CLAUDE.md:97)
    pe_sign_consistency: true


data:
  dataset: tuh_eeg
  data_dir: data_ext4/tusz/edf
  cache_dir: cache/tusz_mmap  # Memory-mapped `_data.npy`/`_labels.npy` stems (read-only)
  sampling_rate: 256
  n_channels: 19
  window_size: 60
  stride: 10
  use_balanced_sampling: false  # MUST be false for BGB_LIMIT_FILES to work!
  num_workers: 0  # WSL2 stability
  pin_memory: false
  persistent_workers: false
  prefetch_factor: 2

preprocessing:
  montage: "10-20"
  bandpass: [0.5, 120.0]
  notch_freq: 60
  normalize: true

training:
  epochs: 1
  batch_size: 8  # OPTIMIZED: 2x faster (matches train.yaml)
  learning_rate: 5.0e-5
  weight_decay: 0.05
  optimizer: adamw
  gradient_clip: 0.5
  mixed_precision: false  # Disabled for RTX 4090 stability

  loss: focal
  focal_alpha: 0.5
  focal_gamma: 2.0

  scheduler:
    type: cosine
    warmup_ratio: 0.1

  early_stopping:
    patience: 5
    metric: sensitivity_at_10fa

postprocessing:
  hysteresis:
    tau_on: 0.86    # Matches constants.HYSTERESIS_TAU_ON
    tau_off: 0.78   # Matches constants.HYSTERESIS_TAU_OFF
  morphology:
    opening_kernel: 11
    closing_kernel: 31
  duration:
    min_duration_s: 3.0
    max_duration_s: 600.0
  events:
    tau_merge: 2.0
    confidence_method: mean

evaluation:
  fa_rates: [10, 5, 2.5, 1]
  save_predictions: false
  save_plots: false

logging:
  log_every_n_steps: 10
  log_gradients: false
  log_weights: false
