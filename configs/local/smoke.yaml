# Smoke Test: TCN + Bi-Mamba + GNN Stack (V3)
# Quick validation (1 epoch) for pipeline testing on RTX 4090
#
# ========================================================================
# 🚨 CRITICAL: NaN Protection (REQUIRED for PyTorch 2.5.0+)
# ========================================================================
# BEFORE running smoke test, set these environment variables:
#
#   export BGB_SANITIZE_GRADS=1  # ✅ REQUIRED - prevents gradient explosion
#   export BGB_NAN_DEBUG=1       # ✅ RECOMMENDED - shows NaN warnings
#   export BGB_SMOKE_TEST=1      # ✅ Enables smoke test mode (3 files)
#
# Usage:
#   export BGB_SANITIZE_GRADS=1 BGB_NAN_DEBUG=1 BGB_SMOKE_TEST=1
#   python -m src train configs/local/smoke.yaml
#
# Or use Makefile:
#   make s  # Automatically sets required flags
#
# See: NAN-PROTECTION-REFERENCE.md (root) for complete reference
# ========================================================================
#

experiment:
  name: smoke_test
  description: "Stack smoke test - TCN+BiMamba+GNN"
  seed: 42
  output_dir: results/smoke
  device: cuda

model:
  architecture: v3  # V3 dual-stream with learned adjacency

  tcn:
    num_layers: 8
    kernel_size: 7
    dropout: 0.15
    causal: false
    stride_down: 16
    use_cuda_optimizations: true

  mamba:
    n_layers: 6
    d_model: 512
    d_state: 16
    conv_kernel: 4  # CUDA constraint: must be 2-4
    dropout: 0.1

  graph:
    enabled: true
    edge_features: cosine
    edge_top_k: 3
    edge_threshold: 1.0e-4
    edge_mamba_layers: 2
    edge_mamba_d_state: 8
    edge_mamba_d_model: 16
    edge_similarity_margin: 0.01  # PR-5: Safety margin from ±1 boundaries


    n_layers: 2
    dropout: 0.1
    use_residual: true
    alpha: 0.05
    k_eigenvectors: 16
    use_dynamic_pe: true
    semi_dynamic_interval: 10
    pe_sign_consistency: true


data:
  dataset: tuh_eeg
  data_dir: data_ext4/tusz/edf
  cache_dir: cache/tusz
  split_policy: official_tusz
  sampling_rate: 256
  n_channels: 19
  window_size: 60
  stride: 10
  use_balanced_sampling: false  # MUST be false for BGB_LIMIT_FILES to work!
  num_workers: 0  # WSL2 stability
  pin_memory: false
  persistent_workers: false
  prefetch_factor: 2

preprocessing:
  montage: "10-20"
  bandpass: [0.5, 120.0]
  notch_freq: 60
  normalize: true
  use_mne: true

training:
  epochs: 1
  batch_size: 4  # Reduced for PyTorch 2.5 higher VRAM usage
  learning_rate: 5.0e-5
  weight_decay: 0.05
  optimizer: adamw
  gradient_clip: 0.5
  mixed_precision: false  # Disabled for RTX 4090 stability

  loss: focal
  focal_alpha: 0.5
  focal_gamma: 2.0

  scheduler:
    type: cosine
    warmup_ratio: 0.1

  early_stopping:
    patience: 5
    metric: sensitivity_at_10fa

postprocessing:
  hysteresis:
    tau_on: 0.86
    tau_off: 0.78
  morphology:
    opening_kernel: 11
    closing_kernel: 31
  duration:
    min_duration_s: 3.0
    max_duration_s: 600.0
  events:
    tau_merge: 2.0
    confidence_method: mean

evaluation:
  metrics: [taes, sensitivity, specificity, auroc]
  fa_rates: [10, 5, 2.5, 1]
  save_predictions: false
  save_plots: false

logging:
  log_every_n_steps: 10
  log_gradients: false
  log_weights: false
