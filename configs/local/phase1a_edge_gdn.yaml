# Phase 1a: Edge Stream GDN Validation
# Tests edge stream with BiGatedDeltaNet while keeping node stream on BiMamba2
# Based on Doc 1 (FLASH_LINEAR_ATTENTION_DOC1_EDGE_MIGRATION.md)
#
# CRITICAL: This is NOT a migration/replacement - BiMamba2 remains DEFAULT
# This is VALIDATION of GDN as an experimental option (coexistence strategy)
#
# Configuration:
#   - Node stream: BiMamba2 (stable baseline - unchanged)
#   - Edge stream: BiGatedDeltaNet (experimental)
#   - Edge d_model: 24 (increased from baseline 16 due to FLA causal_conv1d requirement)
#   - GNN/TCN/Decoder: v3.8.3 baseline (unchanged)
#
# NOTE: FLA's causal_conv1d requires d_model >= 24 (hardware alignment)
# This increases edge stream capacity vs baseline (16 → 24 = +50%)
# Parameter impact will be recalculated after smoke test
#
# Usage:
#   export BGB_LIMIT_FILES=50
#   python -m src train configs/local/phase1a_edge_gdn.yaml

experiment:
  name: phase1a_edge_gdn
  description: "Phase 1a - Edge stream GDN validation (node stays BiMamba2)"
  seed: 42
  output_dir: results/phase1a_edge_gdn
  cache_dir: cache/tusz_mmap
  device: cuda
  log_level: INFO
  save_model: true
  save_best_only: true

  wandb:
    enabled: true
    project: seizure-v3-fla-validation
    entity: null

model:
  architecture: v3

  norms:
    boundary_norm: layernorm
    boundary_eps: 1.0e-5
    layerscale_alpha: 0.1
    after_tcn_proj: true
    after_node_mamba: true
    after_edge_mamba: true
    after_gnn: true
    before_decoder: true

  tcn:
    num_layers: 8
    kernel_size: 7
    dropout: 0.15
    causal: false
    stride_down: 16
    use_cuda_optimizations: true

  mamba:
    n_layers: 6
    d_model: 512
    d_state: 16
    conv_kernel: 4
    dropout: 0.1

    # PHASE 1A: GDN for edge stream ONLY
    temporal_type: bimamba2              # Global default (node fallback)
    temporal_type_node: null             # null = use global (BiMamba2)
    temporal_type_edge: gated_deltanet   # Override: edge uses GDN
    gdn_fusion_mode: sum                 # Bidirectional fusion (simpler than concat)
    gdn_allow_neg_eigval: false          # Conservative start

    # Edge GDN head config (required for edge_mamba_d_model=32)
    # Constraint: num_heads × headdim = 0.75 × d_model
    # 3 × 8 = 24 = 0.75 × 32 ✅
    gdn_edge_num_heads: 3
    gdn_edge_headdim: 8

  graph:
    enabled: true

    edge_lift_activation: tanh
    edge_lift_norm: layernorm
    edge_lift_init_gain: 0.1

    edge_features: cosine
    edge_top_k: 3
    edge_threshold: 1.0e-4
    edge_mamba_layers: 2
    edge_mamba_d_state: 8
    edge_mamba_d_model: 32
    edge_similarity_margin: 0.01

    adj_row_softmax: true
    adj_softmax_tau: 1.0
    adj_ema_beta: 0.95
    adj_force_symmetric: true
    laplacian_eps: 1.0e-3
    laplacian_normalize: true

    n_layers: 2
    dropout: 0.1
    use_residual: true
    alpha: 0.05
    k_eigenvectors: 16

    use_dynamic_pe: true
    semi_dynamic_interval: 5
    pe_sign_consistency: true

data:
  dataset: tuh_eeg
  data_dir: data_ext4/tusz/edf
  cache_dir: cache/tusz_mmap
  sampling_rate: 256
  n_channels: 19
  window_size: 60
  stride: 10
  use_balanced_sampling: true
  num_workers: 0
  pin_memory: true
  persistent_workers: false
  prefetch_factor: 2

preprocessing:
  montage: "10-20"
  bandpass: [0.5, 120.0]
  notch_freq: 60
  normalize: true

training:
  epochs: 10  # Short validation run (not full 100)

  batch_size: 8
  learning_rate: 1.0e-4
  weight_decay: 0.01
  optimizer: adamw
  gradient_clip: 0.5
  mixed_precision: false

  loss: focal
  focal_alpha: 0.5
  focal_gamma: 2.0

  scheduler:
    type: cosine
    warmup_ratio: 0.03

  warmup_schedule:
    enabled: true
    warmup_steps: 1000
    adj_temperature_enabled: true
    adj_temperature_start: 2.0
    adj_temperature_end: 1.0
    focal_gamma_enabled: true
    focal_gamma_start: 1.0
    focal_gamma_end: 2.0

  early_stopping:
    patience: 5
    metric: sensitivity_at_10fa

  checkpoint_interval: 1
  mid_checkpoint_interval_s: 1800
  mid_epoch_keep: 3
  gradient_accumulation_steps: 1

postprocessing:
  hysteresis:
    tau_on: 0.86
    tau_off: 0.78
  morphology:
    opening_kernel: 11
    closing_kernel: 31
  duration:
    min_duration_s: 3.0
    max_duration_s: 600.0
  events:
    tau_merge: 2.0
    confidence_method: mean

evaluation:
  fa_rates: [10, 5, 2.5, 1]
  save_predictions: false
  save_plots: false

logging:
  log_every_n_steps: 50
  log_gradients: false
  log_weights: false
